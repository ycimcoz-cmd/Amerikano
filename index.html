<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amerikano</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:12px;color:#222;background:#fafafa}
h2{font-size:16px;margin:22px 0 8px}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}
th,td{padding:5px 2px;border-bottom:1px solid #ddd;text-align:center;vertical-align:top}
th{font-size:12px}
td.r{text-align:left;padding-top:8px}
.rn{cursor:pointer;text-decoration:underline dotted #aaa}
.dl{width:100%;font-size:11px;height:22px;margin-top:4px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#666;padding:0}
td input{width:100%;height:32px;text-align:center;font-size:15px;border:1px solid #ccc;border-radius:6px}
td.win input{border-color:#5a5;background:#eef8ec}
.pen{display:flex;gap:2px;margin-top:3px}
.pen button,.outb{flex:1;min-width:0;height:24px;font-size:11px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#888;padding:0}
.outb{width:100%;margin-top:2px}
.pen button.on{background:#fde8e8;color:#a32d2d;border-color:#e99}
.outb.on{background:#e3f4e1;color:#2b6a1f;border-color:#8c8}
.fin{font-size:11px;color:#a32d2d;min-height:14px}
tfoot td{border:none;font-size:12px;color:#666}
tfoot tr.tot td{font-weight:600;font-size:16px;color:#222}
.lead{background:#e3f4e1;color:#2b6a1f;border-radius:6px}
tr.cur td{background:#fff6d9}
tr.cur td.r .rn{font-weight:600}
#rule{background:#eef3fb;border-radius:8px;padding:10px 12px;font-size:13px;margin:8px 0;display:none}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.bar button,.set button{padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;font-size:14px}
.set input{height:34px;font-size:14px;border:1px solid #ccc;border-radius:6px;padding:0 8px}
.set div{display:flex;gap:6px;margin:6px 0;align-items:center}
.hist{font-size:13px;border-bottom:1px solid #ddd;padding:6px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none}
</style></head><body>
<div id="rule"></div>
<table id="tbl"></table>
<p id="status" style="font-size:13px;color:#666"></p>
<div class="bar">
<button id="undo">Undo</button>
<button id="share">Share results</button>
<button id="finish">Finish and save game</button>
<button id="newg">New game</button>
</div>
<h2>Players and settings</h2>
<div class="set" id="set"></div>
<h2>All-time leaderboard</h2>
<div id="lb"></div>
<h2>Past games</h2>
<div id="hist"></div>
<div id="toast"></div>
<script>
const ROUNDS=[
["1× 3 küt","Open with one set of 3: same number, different suits. No jokers when opening."],
["1× 3 seri","Open with one run of 3 in the same suit, e.g. 4-5-6. No jokers when opening."],
["2× 3 küt","Open with two sets of 3. No jokers when opening."],
["2× 3 seri","Open with two runs of 3. No jokers when opening."],
["3 küt + 3 seri","Open with one set of 3 and one run of 3. No jokers when opening."],
["1× 4 küt","Open with one set of 4. Jokers can now be used to open."],
["1× 4 seri","Open with one run of 4. Jokers allowed."],
["2× 4 küt","Open with two sets of 4. Jokers allowed."],
["2× 4 seri","Open with two runs of 4. Jokers allowed."],
["4 küt + 4 seri","Open with one set of 4 and one run of 4. Jokers allowed."],
["5li seri","Open with one run of 5. Jokers allowed."],
["Pairs","Open with 4 pairs. Each pair is two of the exact same card: same number and same suit."],
["Final","Go out in one go: arrange your whole hand into melds, discard one card and lay everything down, like okey."]
];
const N=ROUNDS.length,KEY="amerikano-v2",HKEY="amerikano-history";
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function grid(n,v){return ROUNDS.map(()=>Array(n).fill(v));}
function blank(names){const n=names.length;return{names:names.slice(),base:grid(n,""),jk:grid(n,0),mp:grid(n,0),out:Array(N).fill(-1),dealt:Array(N).fill(-1),outScore:-50};}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=load(KEY);
if(!S){const o=load("amerikano-v1");if(o){S=blank(o.names);S.base=o.base;S.jk=o.jk;S.mp=o.mp;}}
if(!S)S=blank(["Hebe","Clara","Sam","Yusuf"]);
if(!S.dealt){S.dealt=Array(N).fill(-1);delete S.dealer;}
if(!S.out)S.out=Array(N).fill(-1);
if(S.outScore===undefined)S.outScore=-50;
let H=load(HKEY)||[],undoStack=[],pending=null;
function snap(){undoStack.push(JSON.stringify(S));if(undoStack.length>50)undoStack.shift();}
function num(v){const n=parseInt(String(v).replace(/[^\d-]/g,""),10);return isNaN(n)?null:n;}
function score(i,p){const b=num(S.base[i][p]),pen=S.jk[i][p]||S.mp[i][p];if(b===null&&!pen)return null;return(b||0)*(S.jk[i][p]?2:1)+50*S.mp[i][p];}
function totals(){const n=S.names.length,t=Array(n).fill(0);let played=0,cur=-1;for(let i=0;i<N;i++){let any=false;for(let p=0;p<n;p++){const s=score(i,p);if(s!==null){t[p]+=s;any=true;}}if(any)played++;else if(cur<0)cur=i;}return{t,played,cur};}
function cells(pre){let s='';for(let p=0;p<S.names.length;p++)s+='<td id="'+pre+p+'"></td>';return s;}
function render(){
 const n=S.names.length;
 let h='<colgroup><col style="width:80px">'+'<col>'.repeat(n)+'</colgroup><thead><tr><th style="text-align:left">Round</th>';
 S.names.forEach(x=>h+='<th>'+esc(x)+'</th>');
 h+='</tr></thead><tbody>';
 ROUNDS.forEach((r,i)=>{
  h+='<tr id="row'+i+'"><td class="r"><span class="rn" data-rule="'+i+'">'+r[0]+'</span><select class="dl" data-d="'+i+'" aria-label="Dealer for '+r[0]+'"><option value="-1">Dealer</option>'+S.names.map((x,p)=>'<option value="'+p+'"'+(S.dealt[i]===p?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></td>';
  for(let p=0;p<n;p++){
   h+='<td'+(S.out[i]===p?' class="win"':'')+'><input inputmode="text" data-r="'+i+'" data-p="'+p+'" value="'+esc(S.base[i][p])+'">'
   +'<div class="pen"><button data-k="j" data-r="'+i+'" data-p="'+p+'" class="'+(S.jk[i][p]?'on':'')+'">×2</button>'
   +'<button data-k="m" data-r="'+i+'" data-p="'+p+'" class="'+(S.mp[i][p]?'on':'')+'">'+(S.mp[i][p]>1?'+50×'+S.mp[i][p]:'+50')+'</button></div>'
   +'<button class="outb'+(S.out[i]===p?' on':'')+'" data-k="o" data-r="'+i+'" data-p="'+p+'">Out</button>'
   +'<div class="fin" id="f'+i+'_'+p+'"></div></td>';
  }
  h+='</tr>';
 });
 h+='</tbody><tfoot><tr class="tot"><td class="r">Total</td>'+cells('t')+'</tr><tr><td class="r">Behind</td>'+cells('g')+'</tr><tr><td class="r">Rounds won</td>'+cells('w')+'</tr></tfoot>';
 $('tbl').innerHTML=h;
 renderSettings();renderHistory();calc();
}
function calc(){
 const n=S.names.length,{t,played,cur}=totals();
 for(let i=0;i<N;i++)$('row'+i).classList.toggle('cur',i===cur);
 for(let i=0;i<N;i++)for(let p=0;p<n;p++){const pen=S.jk[i][p]||S.mp[i][p],s=score(i,p);$('f'+i+'_'+p).textContent=pen&&s!==null?'= '+s:'';}
 const min=Math.min(...t),wins=Array(n).fill(0);
 S.out.forEach(o=>{if(o>=0&&o<n)wins[o]++;});
 t.forEach((v,p)=>{const el=$('t'+p);el.textContent=v;el.className=v===min?'lead':'';$('g'+p).textContent=v===min?'–':'+'+(v-min);$('w'+p).textContent=wins[p];});
 const leaders=S.names.filter((x,p)=>t[p]===min);
 $('status').textContent=(played?played+' of '+N+' rounds played, '+(N-played)+' left. Lowest total wins — '+leaders.join(' and ')+(leaders.length>1?' are':' is')+' leading.':'No rounds played yet. Lowest total wins.')+' Tap a round name for its rules.';
 store(KEY,S);
}
function renderSettings(){
 let h='';
 S.names.forEach((x,p)=>h+='<div><input data-n="'+p+'" value="'+esc(x)+'" style="flex:1"><button data-del="'+p+'">Remove</button></div>');
 h+='<div><button id="addp">Add player</button></div>';
 h+='<div>Going-out score <input id="os" inputmode="text" value="'+S.outScore+'" style="width:70px"></div>';
 $('set').innerHTML=h;
}
function renderHistory(){
 if(!H.length){$('lb').innerHTML='<p style="font-size:13px;color:#888">Finish a game to start the leaderboard.</p>';$('hist').innerHTML='';return;}
 const lb={};
 H.forEach(g=>{g.names.forEach(x=>{lb[x]=lb[x]||{w:0,g:0};lb[x].g++;});g.winners.forEach(x=>lb[x].w++);});
 $('lb').innerHTML=Object.entries(lb).sort((a,b)=>b[1].w-a[1].w||a[1].g-b[1].g).map(([x,v])=>'<div class="hist"><b>'+esc(x)+'</b> — '+v.w+' win'+(v.w===1?'':'s')+' from '+v.g+' game'+(v.g===1?'':'s')+'</div>').join('');
 $('hist').innerHTML=H.map(g=>'<div class="hist">'+new Date(g.date).toLocaleDateString('en-GB')+' — winner: <b>'+g.winners.map(esc).join(', ')+'</b><br><small style="color:#666">'+g.names.map((x,p)=>esc(x)+' '+g.totals[p]).join(' · ')+'</small></div>').join('')+'<div class="bar"><button id="clearh">Clear history</button></div>';
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800);}
function summary(){const {t,played}=totals();return 'Amerikano — '+new Date().toLocaleDateString('en-GB')+' ('+played+'/'+N+' rounds)\n'+S.names.map((x,p)=>[x,t[p]]).sort((a,b)=>a[1]-b[1]).map((x,k)=>(k+1)+'. '+x[0]+': '+x[1]).join('\n');}
function newGame(){const keep=S.names,os=S.outScore;S=blank(keep);S.outScore=os;undoStack=[];render();}

document.addEventListener('focusin',e=>{const d=e.target.dataset;if(d.r!==undefined||d.n!==undefined)pending=JSON.stringify(S);});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.r!==undefined){S.base[d.r][d.p]=e.target.value;calc();}});
document.addEventListener('change',e=>{
 const el=e.target,d=el.dataset;
 if(d.d!==undefined){snap();S.dealt[+d.d]=+el.value;store(KEY,S);return;}
 if(d.n!==undefined){if(pending){undoStack.push(pending);pending=null;}S.names[d.n]=el.value.trim()||('Player '+(+d.n+1));render();return;}
 if(el.id==='os'){const v=num(el.value);if(v===null){toast('Enter a number');el.value=S.outScore;return;}snap();const old=S.outScore;S.out.forEach((o,i)=>{if(o>=0&&num(S.base[i][o])===old)S.base[i][o]=String(v);});S.outScore=v;render();return;}
 if(pending){undoStack.push(pending);pending=null;}
});
$('tbl').addEventListener('click',e=>{
 const rc=e.target.closest('[data-rule]');
 if(rc){const i=+rc.dataset.rule,box=$('rule');box.style.display='block';box.innerHTML='<b>'+ROUNDS[i][0]+'</b><br>'+ROUNDS[i][1]+'<br><small>Nobody can lay down cards on their first turn. Tap to close.</small>';box.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
 const b=e.target.closest('button');if(!b)return;
 const r=+b.dataset.r,p=+b.dataset.p;snap();
 if(b.dataset.k==='j')S.jk[r][p]=S.jk[r][p]?0:1;
 else if(b.dataset.k==='m')S.mp[r][p]=(S.mp[r][p]+1)%4;
 else{
  if(S.out[r]===p){S.out[r]=-1;if(num(S.base[r][p])===S.outScore)S.base[r][p]="";}
  else{const o=S.out[r];if(o>=0&&num(S.base[r][o])===S.outScore)S.base[r][o]="";S.out[r]=p;S.base[r][p]=String(S.outScore);}
 }
 render();
});
$('rule').onclick=()=>$('rule').style.display='none';
$('set').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='addp'){if(S.names.length>=6){toast('Six players max');return;}snap();S.names.push('Player '+(S.names.length+1));S.base.forEach(r=>r.push(''));S.jk.forEach(r=>r.push(0));S.mp.forEach(r=>r.push(0));render();}
 else if(b.dataset.del!==undefined){
  if(S.names.length<=2){toast('Need at least two players');return;}
  const p=+b.dataset.del;if(!confirm('Remove '+S.names[p]+' and their scores?'))return;
  snap();S.names.splice(p,1);[S.base,S.jk,S.mp].forEach(g=>g.forEach(r=>r.splice(p,1)));
  const fix=o=>o===p?-1:o>p?o-1:o;S.out=S.out.map(fix);S.dealt=S.dealt.map(fix);render();
 }
});
$('undo').onclick=()=>{const s=undoStack.pop();if(!s){toast('Nothing to undo');return;}S=JSON.parse(s);render();toast('Undone');};
$('share').onclick=async()=>{const txt=summary();try{if(navigator.share){await navigator.share({text:txt});return;}}catch(e){if(e.name==='AbortError')return;}try{await navigator.clipboard.writeText(txt);toast('Copied');}catch(e){prompt('Copy this:',txt);}};
$('finish').onclick=()=>{const {t,played}=totals();if(!played){toast('No scores yet');return;}if(!confirm('Save this game to history and start a new one?'))return;const min=Math.min(...t);H.unshift({date:new Date().toISOString(),names:S.names.slice(),totals:t,winners:S.names.filter((x,p)=>t[p]===min),played});store(HKEY,H);newGame();toast('Game saved');};
$('newg').onclick=()=>{if(confirm('Start a new game without saving? This clears all scores.'))newGame();};
$('hist').addEventListener('click',e=>{if(e.target.id==='clearh'&&confirm('Delete all past games?')){H=[];store(HKEY,H);renderHistory();}});
render();
{const c=totals().cur;if(c>2)$('row'+c).scrollIntoView({block:'center'});}
</script></body></html>
